<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Guest Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#0f172a; color:#e2e8f0; min-height:100vh; display:flex; align-items:center;}</style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4 card bg-dark border-secondary p-4 shadow">
                <h4 class="text-warning text-center mb-3">📝 Admission Register</h4>
                <p class="small text-muted text-center mb-4">Register your account. Credentials will automatically save to the Admin's console log database.</p>
                {% if error %}<div class="alert alert-danger p-2 small text-center">{{error}}</div>{% endif %}
                
                <form method="POST">
                    <div class="mb-2"><label class="small text-muted">Choose Sandbox Username</label><input type="text" name="username" class="form-control bg-transparent text-white border-secondary" required></div>
                    <div class="mb-2"><label class="small text-muted">Set Passphrase</label><input type="password" name="password" class="form-control bg-transparent text-white border-secondary" required></div>
                    <div class="mb-4"><label class="small text-muted">Company / Institution Unit</label><input type="text" name="organization" class="form-control bg-transparent text-white border-secondary" required></div>
                    <button type="submit" class="btn btn-warning w-100 text-dark fw-bold">Commit Admission Log</button>
                </form>
                
                <div class="text-center mt-3 border-top border-secondary pt-2">
                    <a href="/guest/login" class="text-muted text-decoration-none small">← Cancel and Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
