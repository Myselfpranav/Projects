<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#0f172a; color:#e2e8f0; min-height:100vh; display:flex; align-items:center;}</style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4 card bg-dark border-secondary p-4 shadow">
                <h4 class="text-info text-center mb-4">🔐 Admin Terminal Login</h4>
                {% if error %}<div class="alert alert-danger p-2 small text-center">{{error}}</div>{% endif %}
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="small text-muted mb-1">Admin User ID</label>
                        <input type="text" name="username" class="form-control bg-transparent text-white border-secondary" autocomplete="off" required>
                    </div>
                    <div class="mb-4">
                        <label class="small text-muted mb-1">Passphrase</label>
                        <input type="password" name="password" class="form-control bg-transparent text-white border-secondary" autocomplete="off" required>
                    </div>
                    <button type="submit" class="btn btn-info text-white w-100">Authenticate Operator</button>
                </form>
                
                <div class="text-center mt-3 border-top border-secondary pt-2">
                    <a href="/" class="text-muted text-decoration-none small">← Back to Main System Home</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
