<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guest Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#0f172a; color:#e2e8f0; min-height:100vh; display:flex; align-items:center; }
        .card { background:#1e293b; border:1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4 card p-4 shadow">
                <h4 class="text-success text-center mb-4">🔑 Guest Sandbox Portal</h4>
                
                {% if error %}
                    <div class="alert alert-danger p-2 small text-center">{{ error }}</div>
                {% endif %}
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="small text-muted mb-1">Sandbox Username</label>
                        <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <div class="mb-4">
                        <label class="small text-muted mb-1">Passphrase</label>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mb-3">Launch Evaluation Desk</button>
                </form>
                
                <div class="text-center border-top border-secondary pt-2 mb-2">
                    <a href="/guest/register" class="btn btn-sm btn-outline-warning text-warning w-100">Create Registered Profile Account</a>
                </div>
                <div class="text-center">
                    <a href="/" class="text-muted text-decoration-none small">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
